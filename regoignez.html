    <section>
        
        <form action="" class="container">
            <h1>EDUVALUATION</h1>
            <div class="row">
                <div class="col main">
                    <h3>Personnel Informations</h3>
                    <div class="part fullname">
                        <input required value=""  type="text" placeholder="Nom" >
                        <input required value=""  type="text" placeholder="Prenom">
                    </div>

                    

                    <div class="part birth_gender">
                        <input required  type="date" name="" id="">
                       <div class="gender">
                        <label for="male"><input required value="" type="radio" name="gender" id="male">Masculin</label>
                        <label for="female"><input required value="" type="radio" name="gender" id="female">féminin</label>
                       </div>

                    </div>
                    
                    <hr>
                    
                    
                    
                    <div class="part residence">
                        <h3>Résidence</h3>
                        <label for="nationality">Nationalité:
                            <select name="nationality" id="nationality">
                                <option value="">Marocain</option>
                                <option value="">Etrangère</option>
                            </select>
                        </label>
                        <label for="city">Ville :
                            <select name="city" id="city">
                                <option value="casa">casablanca</option>
                                <option value="rabat">rabat</option>
                                <option value="fes">fes</option>
                                <option value="tanger">tanger</option>
                                <option value="">Autre</option>
                               
                            </select>
                        </label>
                        <label for="postal">Code Postal : 
                            <input required value="" type="number" max="60000" placeholder="Code postal" >
                        </label>
                       

                    </div>
                    <div class="part login">
                        <h3>Connexion</h3>

                        <input  required value="" type="tel" name="tel" id="personal_phone_number" placeholder="Numéro de téléphone" pattern="[0-9]" title="Ne doit avoir que des chiffres" maxlength="20">
                        <input  required value="" type="email" placeholder="Adresse Email" maxlength="20">
                        <input required value="" type="password" name="key" id="login_password" placeholder="Crée un mote de pass" maxlength="20">
                        <input required value="" type="password" name="key" id="login_password" placeholder="Confirmer le mote de pass" maxlength="20">
                        <label for="rem"><input style="accent-color: var(--clean3);" type="checkbox" name="" id="rem"> Remember</label>
                        <input type="submit" value="Enregistrer">
                    </div>



                    
                    
            
                </div>

                <div class="col col2" >
                    <img src="media/portrait_maria.jpg" alt=""><img src="media/portrait_msmhavisham.jpg" alt="">
                </div>
